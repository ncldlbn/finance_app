<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi — Finance Tracker</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
    <form method="POST" class="form-card login-card">
        <div class="login-brand">
            <div class="brand-icon"><span class="material-icons-round" style="font-size:1rem">account_balance_wallet</span></div>
            <div class="brand-name">Finance<strong>Tracker</strong></div>
        </div>
        <div class="flash flash-warning" id="http-warning" style="display:none;margin-bottom:16px">
            Connessione non cifrata (http): il browser non salva l'accesso e la password viaggia in chiaro.
            <a id="https-link" href="#" style="color:inherit;text-decoration:underline">Apri la versione https</a>
        </div>
        {% if error %}<div class="flash flash-error" style="margin-bottom:16px">{{ error }}</div>{% endif %}
        <div class="form-stack">
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" autocomplete="current-password" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><span class="material-icons-round">lock_open</span>Accedi</button>
        </div>
    </form>
</div>
<script>
// Il cookie di accesso è "solo HTTPS": su http il browser lo scarta e il login sembra non fare nulla.
if (location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
    document.getElementById('http-warning').style.display = '';
    document.getElementById('https-link').href = 'https://' + location.host + location.pathname + location.search;
}
</script>
</body>
</html>
