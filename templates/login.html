{% extends "auth_base.html" %}
{% block title %}Accedi{% endblock %}
{% block card %}
<form method="POST">
    <div class="form-stack">
        <div class="form-group">
            <label>Nome utente o email</label>
            <input type="text" name="username" class="form-control" autocomplete="username" autocapitalize="none" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block"><span class="material-icons-round">lock_open</span>Accedi</button>
    </div>
</form>
<p class="auth-links">
    <a href="{{ url_for('auth.forgot') }}">Password dimenticata?</a>
    {% if registration_open %}<span>·</span><a href="{{ url_for('auth.register') }}">Crea un account</a>{% endif %}
</p>
{% endblock %}
