{% extends "auth_base.html" %}
{% block title %}Crea account{% endblock %}
{% block card %}
<form method="POST">
    <div class="form-stack">
        <div class="form-group">
            <label>Nome utente</label>
            <input type="text" name="username" value="{{ username }}" class="form-control" autocomplete="username" autocapitalize="none" pattern="[A-Za-z0-9._\-]{3,40}" required autofocus>
        </div>
        <div class="form-group">
            <label>Email <span style="font-weight:400;opacity:.6">(ti mandiamo un link per confermarla)</span></label>
            <input type="email" name="email" value="{{ email }}" class="form-control" autocomplete="email" autocapitalize="none" maxlength="254" required>
        </div>
        <div class="form-group">
            <label>Password <span style="font-weight:400;opacity:.6">(almeno 8 caratteri)</span></label>
            <input type="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-group">
            <label>Ripeti la password</label>
            <input type="password" name="password2" class="form-control" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block"><span class="material-icons-round">person_add</span>Crea account</button>
    </div>
</form>
<p class="auth-links">Hai già un account? <a href="{{ url_for('auth.login') }}">Accedi</a></p>
{% endblock %}
