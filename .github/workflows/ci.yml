name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dipendenze
        run: pip install -r requirements.txt ruff
      - name: Controlli statici (errori veri, non stile)
        run: ruff check .
      - name: Isolamento tra utenti (controllo statico delle interrogazioni SQL)
        run: python scripts/check_scoping.py
      - name: Prova di fumo (pagine, input malformati, migrazioni, utenti e demo)
        run: python scripts/smoke.py
