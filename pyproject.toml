[tool.ruff]
line-length = 140            # il codice ha righe lunghe (commenti in italiano): non si impone un limite stretto
target-version = "py310"
extend-exclude = ["docs", "data", "logs"]

[tool.ruff.lint]
# Solo controlli che trovano errori veri: sintassi (E9), pyflakes (F: nomi inesistenti, import e variabili
# inutilizzati), bugbear (B: trappole comuni). Lo stile non si controlla.
select = ["E9", "F", "B"]
ignore = ["B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B"]
